<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deckbuilder</title>
<style>
  :root { --bg: #16171a; --panel: #1e1f23; --line: #2e3036; --text: #e4e4e7; --dim: #9a9aa3; --accent: #9b6bff; --own: #3ec46d; }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); }
  #main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  #side { width: 340px; overflow-y: auto; padding: 16px; background: var(--panel); border-left: 1px solid var(--line); }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input[type=checkbox] { accent-color: var(--accent); padding: 0; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; background: var(--panel); }
  button:hover, .upload:hover { border-color: var(--accent); }
  .upload { display: inline-block; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  label { cursor: pointer; white-space: nowrap; }
  #bar { display: flex; gap: 8px; flex-wrap: wrap; }
  #bar #q { flex: 2; min-width: 240px; }
  #bar #name { flex: 1; min-width: 160px; }
  details { margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  summary { cursor: pointer; padding: 8px 12px; color: var(--accent); user-select: none; }
  .grid { display: grid; grid-template-columns: 130px 1fr; gap: 10px 16px; align-items: center; padding: 4px 12px 14px; }
  .grid > span { color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .row input:not([type=checkbox]) { width: 260px; }
  .row input[type=number] { width: 90px; }
  #querybar { margin: 12px 0 4px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  #full { color: var(--dim); font-size: 12px; }
  #status { color: var(--accent); font-size: 12px; }
  h3 { margin: 16px 0 8px; font-size: 15px; font-weight: 600; }
  h4 { margin: 12px 0 4px; font-size: 13px; color: var(--dim); }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { cursor: pointer; position: relative; transition: transform .15s; }
  .card:hover { transform: translateY(-3px); }
  .card:hover img { box-shadow: 0 12px 40px rgba(0,0,0,.7); }
  .card img { width: 100%; aspect-ratio: 488 / 680; border-radius: 10px; display: block; }
  .card.owned::after { content: "owned"; position: absolute; top: 6px; right: 6px; background: var(--own); color: #000; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  .card button { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 11px; padding: 3px 8px; opacity: 0; }
  .card:hover button { opacity: 1; }
  .card .edh { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,.75); color: var(--accent); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  #querybar select { padding: 3px 6px; font-size: 12px; }
  #querybar .sort { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12px; }
  #cmdbox { position: relative; width: 240px; margin: 0 auto; }
  #cmdbox img { width: 100%; border-radius: 10px; display: block; }
  #cmdbox .empty { color: var(--dim); border: 1px dashed var(--line); border-radius: 10px; padding: 24px 12px; text-align: center; }
  #cmdbox button { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 8px; }
  .group h4 { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; }
  li:hover { background: var(--bg); }
  li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
  li.owned .dot { background: var(--own); }
  li .x { border: none; background: none; color: var(--dim); padding: 0 4px; visibility: hidden; }
  li:hover .x { visibility: visible; }
  li .x:hover { color: #f55; }
  #preview { position: fixed; width: 336px; border-radius: 12px; pointer-events: none; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.6); z-index: 10; }
  .decksel { display: flex; gap: 6px; }
  .decksel select { flex: 1; min-width: 0; }
  .deckopts { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12px; }
  .deckopts select { padding: 3px 6px; font-size: 12px; }
  #side .buttons { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="main">
  <div id="form">
  <div id="bar">
    <input id="q" placeholder="Raw Scryfall query (optional)">
    <input id="name" placeholder="Card name">
  </div>
  <details>
  <summary>Advanced filters</summary>
  <div class="grid">
    <span>Rules text</span><div class="row"><input id="oracle" placeholder='e.g. draw a card, ~ for card name'></div>
    <span>Type line</span><div class="row"><input id="type" placeholder="e.g. legendary dinosaur -human"></div>
    <span>Colors</span><div class="row"><select id="cop"><option value=">=">including</option><option value="=">exactly</option><option value="<=">at most</option></select><label><input type="checkbox" class="col" value="w"> White</label><label><input type="checkbox" class="col" value="u"> Blue</label><label><input type="checkbox" class="col" value="b"> Black</label><label><input type="checkbox" class="col" value="r"> Red</label><label><input type="checkbox" class="col" value="g"> Green</label><label><input type="checkbox" class="col" value="c"> Colorless</label></div>
    <span>Color identity</span><div class="row"><label><input type="checkbox" class="cid" value="w"> White</label><label><input type="checkbox" class="cid" value="u"> Blue</label><label><input type="checkbox" class="cid" value="b"> Black</label><label><input type="checkbox" class="cid" value="r"> Red</label><label><input type="checkbox" class="cid" value="g"> Green</label><label><input type="checkbox" class="cid" value="c"> Colorless</label><label><input type="checkbox" id="inId" checked> within deck commander</label></div>
    <span>Mana cost</span><div class="row"><input id="mana" placeholder="e.g. 2WW or {2/G}{G}"></div>
    <span>Stats</span><div class="row"><select id="stat"><option value="mv">Mana value</option><option value="pow">Power</option><option value="tou">Toughness</option><option value="pt">Power + toughness</option><option value="loy">Loyalty</option></select><select id="statop"><option value="=">=</option><option value="<">&lt;</option><option value="<=">&le;</option><option value=">">&gt;</option><option value=">=">&ge;</option><option value="!=">&ne;</option></select><input id="statv" type="number" min="0"></div>
    <span>Games</span><div class="row"><label><input type="checkbox" class="game" value="paper"> Paper</label><label><input type="checkbox" class="game" value="arena"> Arena</label><label><input type="checkbox" class="game" value="mtgo"> Magic Online</label></div>
    <span>Format</span><div class="row"><select id="fop"><option value="f">Legal</option><option value="banned">Banned</option><option value="restricted">Restricted</option></select><select id="fmt"><option value="">any</option><option value="commander" selected>commander</option><option value="standard">standard</option><option value="future">future</option><option value="pioneer">pioneer</option><option value="modern">modern</option><option value="legacy">legacy</option><option value="vintage">vintage</option><option value="pauper">pauper</option><option value="paupercommander">paupercommander</option><option value="oathbreaker">oathbreaker</option><option value="brawl">brawl</option><option value="standardbrawl">standardbrawl</option><option value="historic">historic</option><option value="timeless">timeless</option><option value="alchemy">alchemy</option><option value="explorer">explorer</option><option value="gladiator">gladiator</option><option value="penny">penny</option><option value="duel">duel</option><option value="oldschool">oldschool</option><option value="premodern">premodern</option><option value="predh">predh</option></select><label><input type="checkbox" id="isCmd"> can be commander</label></div>
    <span>Sets</span><div class="row"><input id="set" list="sets" placeholder="set codes, e.g. war mh3"><datalist id="sets"></datalist></div>
    <span>Rarity</span><div class="row"><label><input type="checkbox" class="rar" value="common"> Common</label><label><input type="checkbox" class="rar" value="uncommon"> Uncommon</label><label><input type="checkbox" class="rar" value="rare"> Rare</label><label><input type="checkbox" class="rar" value="mythic"> Mythic</label></div>
    <span>Criteria</span><div class="row"><input id="crit" placeholder="is: values, e.g. fetchland -reprint"></div>
    <span>Price</span><div class="row"><select id="cur"><option value="usd">USD</option><option value="eur">EUR</option><option value="tix">TIX</option></select><select id="curop"><option value="=">=</option><option value="<">&lt;</option><option value="<=">&le;</option><option value=">">&gt;</option><option value=">=">&ge;</option><option value="!=">&ne;</option></select><input id="price" type="number" min="0" step="0.01"></div>
    <span>Artist</span><div class="row"><input id="artist" placeholder="e.g. Magali"></div>
    <span>Flavor text</span><div class="row"><input id="flavor" placeholder="e.g. Kjeldoran"></div>
    <span>Language</span><div class="row"><select id="lang"><option value="">default</option><option value="any">any</option><option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="ru">Russian</option><option value="zhs">Simplified Chinese</option><option value="zht">Traditional Chinese</option></select></div>
    <span>Preferences</span><div class="row"><select id="prefer"><option value="">prefer no preference</option><option value="oldest">prefer oldest</option><option value="newest">prefer newest</option><option value="usd-low">prefer usd-low</option><option value="usd-high">prefer usd-high</option><option value="promo">prefer promo</option><option value="default">prefer default</option><option value="atypical">prefer atypical</option><option value="ub">prefer ub</option><option value="notub">prefer notub</option></select><label><input type="checkbox" id="prints"> all prints</label><label><input type="checkbox" id="extras"> include extras</label></div>
  </div>
  </details>
  </div>
  <div id="querybar"><code id="full"></code><span id="status"></span><span class="sort">Sort <select id="order"><option value="edhrec">EDHREC popularity</option><option value="syn">Synergy with commander</option><option value="inc">Inclusion with commander</option><option value="name">name</option><option value="cmc">cmc</option><option value="power">power</option><option value="toughness">toughness</option><option value="color">color</option><option value="rarity">rarity</option><option value="usd">usd</option><option value="eur">eur</option><option value="tix">tix</option><option value="released">released</option><option value="set">set</option><option value="artist">artist</option><option value="penny">penny</option><option value="review">review</option></select><select id="dir"><option value="auto">auto</option><option value="asc">ascending</option><option value="desc">descending</option></select></span></div>
  <h3>Owned (<span id="nOwned">0</span>)</h3>
  <div id="owned" class="results"></div>
  <h3>Not owned (<span id="nOther">0</span>)</h3>
  <div id="other" class="results"></div>
</div>
<div id="side">
  <div class="decksel"><select id="decks"></select><button id="newdeck">New</button><button id="rendeck">Rename</button><button id="deldeck">Delete</button></div>
  <h3>Commander</h3>
  <div id="cmdbox"></div>
  <h3>Deck (<span id="count">0</span>)</h3>
  <div class="deckopts">Group <select id="dgroup"><option value="type">type</option><option value="cost">mana value</option><option value="color">color</option><option value="strategy">strategy</option><option value="none">none</option></select>
  Sort <select id="dsort"><option value="cmc">mana value</option><option value="name">name</option><option value="added">added</option></select></div>
  <div id="deck"></div>
  <div class="buttons"><button id="export">Copy decklist</button>
  <label class="upload">Upload Cards.txt<input type="file" id="upload" accept=".txt,text/plain" hidden></label></div>
</div>
<img id="preview">
<script>
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().trim();
let owned = new Set(), ownedCards = [];
let commanders = new Set();  // names Scryfall's is:commander matches
fetch('commanders.json').then(r => r.json()).then(names => { commanders = new Set(names); redraw(); });
// Decks live on the server in decks.json; every change is saved right away.
let decks = {}, deck = null;
let edh = {}, edhCards = [];  // EDHREC stats by name for the current commander, and their database entries

const isOwned = name => owned.has(norm(name)) || owned.has(norm(name.split(' // ')[0]));

async function loadCollection() {
  $('status').textContent = 'loading card database...';
  ownedCards = await (await fetch('owned.json')).json();
  owned = new Set(ownedCards.flatMap(c => [norm(c.name), norm(c.name.split(' // ')[0])]));
  $('status').textContent = `${ownedCards.length} owned cards loaded`;
}

$('upload').onchange = async () => {
  const file = $('upload').files[0];
  if (!file || !confirm(`Replace your collection with ${file.name}?`)) return ($('upload').value = '');
  await fetch('Cards.txt', { method: 'POST', body: file });
  $('upload').value = '';
  await loadCollection();
  renderDeck(); searchSoon();
};

let saving = Promise.resolve();  // keep saves in order
const postDeck = (name, d) => saving = saving.then(() =>
  fetch('decks.json', { method: 'POST', body: JSON.stringify({ name, deck: d }) }));
function save() { postDeck(deck.name, deck); }

const emptyDeck = name => ({ name, commander: null, identity: '', cards: [], info: {} });

function renderDeckList() {
  $('decks').innerHTML = '';
  for (const name of Object.keys(decks).sort()) $('decks').add(new Option(name, name, false, name === deck.name));
}

function openDeck(name) {
  deck = decks[name];
  deck.info ??= {};  // name -> {img, type, cmc, colors} for the sidebar
  localStorage.setItem('deckName', name);
  edh = {}; edhCards = [];
  renderDeckList(); renderDeck(); fillDeckInfo(); loadEdh();
}

function askName(suggestion) {
  const name = prompt('Deck name', suggestion)?.trim();
  if (name && decks[name]) alert(`A deck named "${name}" already exists.`);
  return name && !decks[name] ? name : null;
}

async function loadDecks() {
  decks = await (await fetch('decks.json')).json();
  const old = JSON.parse(localStorage.getItem('deck') || 'null');  // deck saved in the browser before server storage
  if (old && (old.commander || old.cards?.length)) {
    let name = 'My deck', i = 2;
    while (decks[name]) name = `My deck ${i++}`;
    decks[name] = { ...old, name };
    postDeck(name, decks[name]);
  }
  localStorage.removeItem('deck');
  if (!Object.keys(decks).length) { decks['Deck 1'] = emptyDeck('Deck 1'); postDeck('Deck 1', decks['Deck 1']); }
  const last = localStorage.getItem('deckName');
  openDeck(decks[last] ? last : Object.keys(decks).sort()[0]);
}

$('decks').onchange = () => openDeck($('decks').value);
$('newdeck').onclick = () => {
  let i = 1;
  while (decks[`Deck ${i}`]) i++;
  const name = askName(`Deck ${i}`);
  if (!name) return;
  decks[name] = emptyDeck(name);
  postDeck(name, decks[name]);
  openDeck(name);
};
$('rendeck').onclick = () => {
  const name = askName(deck.name);
  if (!name) return;
  postDeck(deck.name, null);
  delete decks[deck.name];
  deck.name = name;
  decks[name] = deck;
  save(); openDeck(name);
};
$('deldeck').onclick = () => {
  if (!confirm(`Delete "${deck.name}"?`)) return;
  postDeck(deck.name, null);
  delete decks[deck.name];
  if (!Object.keys(decks).length) { decks['Deck 1'] = emptyDeck('Deck 1'); postDeck('Deck 1', decks['Deck 1']); }
  openDeck(Object.keys(decks).sort()[0]);
};

const TYPES = ['Creature', 'Planeswalker', 'Battle', 'Instant', 'Sorcery', 'Artifact', 'Enchantment', 'Land'];
const LABELS = { Sorcery: 'Sorceries', Other: 'Other' };
const typeOf = t => TYPES.find(x => (t || '').includes(x)) || 'Other';
const small = c => c.image_uris?.small || c.card_faces?.[0]?.image_uris?.small;
const big = url => url?.replace('/small/', '/normal/');
const large = url => url?.replace('/small/', '/large/');
const colorsOf = c => c.colors || c.card_faces?.[0]?.colors || [];
// tags (strategies from Scryfall Tagger) only come with database entries, see fillDeckInfo
const remember = c => { deck.info[c.name] = { img: small(c), type: c.type_line, cmc: c.cmc ?? 0, colors: colorsOf(c), tags: c.tags }; };
const COLORS = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
// Each grouper returns the groups a card belongs to; a card can have several strategies.
const groupers = {
  type: i => [typeOf(i.type)],
  cost: i => [i.cmc >= 7 ? '7+' : String(i.cmc)],
  color: i => [i.colors.length > 1 ? 'Multicolor' : COLORS[i.colors[0]] || 'Colorless'],
  strategy: i => i.tags?.length ? i.tags : ['No strategy tag'],
  none: () => ['Cards'],
};
const groupOrder = {
  type: [...TYPES, 'Other'],
  cost: ['0', '1', '2', '3', '4', '5', '6', '7+'],
  color: [...Object.values(COLORS), 'Multicolor', 'Colorless'],
  none: ['Cards'],
};
// strategies are ordered by how many cards they have
const orderGroups = (by, groups) => by !== 'strategy' ? groupOrder[by] : Object.keys(groups)
  .sort((a, b) => (a === 'No strategy tag') - (b === 'No strategy tag') || groups[b].length - groups[a].length);

$('preview').onload = e => { if (e.target.src === e.target.dataset.want) e.target.style.display = 'block'; };

function preview(el, img) {
  const p = $('preview');
  el.onmouseenter = () => {
    if (!img) return;
    const r = el.getBoundingClientRect(), src = large(img);
    p.style.top = Math.max(8, Math.min(r.top - 60, innerHeight - 480)) + 'px';
    p.style.left = (r.left - 348) + 'px';
    // stay hidden until the new image has loaded, so the previous card never flashes
    p.dataset.want = src;
    if (p.src === src && p.complete) p.style.display = 'block';
    else { p.style.display = 'none'; p.src = src; }
  };
  el.onmouseleave = () => { p.dataset.want = ''; p.style.display = 'none'; };
}

function renderDeck() {
  $('preview').style.display = 'none';
  const box = $('cmdbox');
  if (deck.commander) {
    box.innerHTML = `<img src="${big(deck.info[deck.commander]?.img) || ''}" alt=""><button>Remove</button>`;
    box.querySelector('img').alt = deck.commander;
    box.querySelector('button').onclick = () => {
      deck.commander = null; deck.identity = ''; edh = {}; edhCards = [];
      save(); renderDeck(); searchSoon();
    };
  } else box.innerHTML = '<div class="empty">Hover a legendary creature in the results and click "Set commander"</div>';
  $('count').textContent = deck.cards.length + (deck.commander ? 1 : 0);
  const by = $('dgroup').value, sort = $('dsort').value, groups = {};
  const info = n => ({ cmc: 0, colors: [], ...deck.info[n] });
  const names = [...deck.cards];
  if (sort !== 'added') names.sort((a, b) => sort === 'cmc' && info(a).cmc - info(b).cmc || a.localeCompare(b));
  for (const n of names) for (const g of groupers[by](info(n))) (groups[g] ??= []).push(n);
  $('deck').innerHTML = '';
  for (const t of orderGroups(by, groups)) {
    if (!groups[t]) continue;
    const g = document.createElement('div');
    g.className = 'group';
    const label = by === 'type' ? LABELS[t] || t + 's' : by === 'cost' ? `Mana value ${t}` : t;
    g.innerHTML = `<h4><span>${label}</span><span>${groups[t].length}</span></h4><ul></ul>`;
    for (const name of groups[t]) {
      const li = document.createElement('li');
      li.className = isOwned(name) ? 'owned' : '';
      li.innerHTML = '<span class="dot"></span><span class="n"></span><button class="x" title="Remove">×</button>';
      li.querySelector('.n').textContent = name;
      li.querySelector('.x').onclick = () => { deck.cards = deck.cards.filter(n => n !== name); save(); renderDeck(); };
      preview(li, deck.info[name]?.img);
      g.querySelector('ul').appendChild(li);
    }
    $('deck').appendChild(g);
  }
  redraw();
}

// Fill in database info (strategy tags, and images and types for older decks).
async function fillDeckInfo() {
  const missing = [deck.commander, ...deck.cards].filter(n => n && deck.info[n]?.tags === undefined);
  if (!missing.length) return;
  const cards = await (await fetch('cards.json', { method: 'POST', body: JSON.stringify(missing) })).json();
  cards.forEach(remember);
  save(); renderDeck();
}

function addCard(c) {
  if (c.name !== deck.commander && !deck.cards.includes(c.name)) deck.cards.push(c.name);
  remember(c);
  save(); renderDeck();
  if (!c.tags) fillDeckInfo();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Owned cards are filtered locally from the bulk database. Fields that depend on the
// printing (set, price, artist...) or that are not reimplemented here fall back to
// scanning Scryfall search pages; `local` is null in that case.
function buildQuery() {
  const v = id => $(id).value.trim();
  const low = s => (s || '').toLowerCase();
  const quote = x => /[\s()"]/.test(x) ? `"${x.replace(/"/g, '')}"` : x;
  const checked = cls => [...document.querySelectorAll(`.${cls}:checked`)].map(e => e.value);
  const any = terms => terms.length > 1 ? `(${terms.join(' or ')})` : terms[0] || '';
  const cmp = (a, op, b) => ({ '=': a === b, '<': a < b, '<=': a <= b, '>': a > b, '>=': a >= b, '!=': a !== b })[op];
  const setCmp = (have, op, want) => {
    const sub = [...have].every(x => want.has(x)), sup = [...want].every(x => have.has(x));
    return op === '=' ? sub && sup : op === '<=' ? sub : sup;
  };
  const user = [v('q')], tests = [c => !c.hidden];
  let local = !v('q');
  if (v('name')) { user.push(`name:${quote(v('name'))}`); tests.push(c => low(c.name).includes(low(v('name')))); }
  if (v('oracle')) {
    user.push(`o:${quote(v('oracle'))}`);
    // o: skips reminder text; ~ stands for the card's name or "this <object>"
    const self = /\bthis (artifact|battle|creature|enchantment|land|planeswalker|permanent|spell|card|equipment|aura|vehicle|saga)\b/g;
    tests.push(c => {
      let t = low(c.oracle_text).replace(/\([^)]*\)/g, '');
      for (const n of [c.name, ...c.name.split(' // '), c.name.split(',')[0]]) t = t.replaceAll(low(n), '~');
      return t.replace(self, '~').includes(low(v('oracle')));
    });
  }
  for (const w of v('type').split(/\s+/).filter(Boolean)) {
    const neg = w[0] === '-', word = low(neg ? w.slice(1) : w);
    user.push(`${neg ? '-' : ''}t:${word}`);
    tests.push(c => low(c.type_line).includes(word) !== neg);
  }
  const cols = checked('col');
  if (cols.length) {
    const op = $('cop').value, want = new Set(cols.filter(x => x !== 'c'));
    user.push(`c${op}${cols.join('')}`);
    tests.push(c => setCmp(new Set(c.colors.map(low)), op, want));
  }
  const identity = ids => { const want = new Set(ids.filter(x => x !== 'c')); return c => c.color_identity.every(x => want.has(low(x))); };
  const cid = checked('cid');
  if (cid.length) { user.push(`id<=${cid.join('')}`); tests.push(identity(cid)); }
  if (v('statv') !== '') {
    const stat = $('stat').value, op = $('statop').value, n = Number(v('statv'));
    user.push(`${stat}${op}${v('statv')}`);
    // power/toughness/loyalty hold one value per face; any face may match
    const vals = c => stat === 'mv' ? [c.cmc] : stat === 'pt' ? c.power.map((p, i) => Number(p) + Number(c.toughness[i]))
      : ({ pow: c.power, tou: c.toughness, loy: c.loyalty }[stat]).map(Number);
    tests.push(c => vals(c).some(x => cmp(x, op, n)));
  }
  const fmt = $('fmt').value, fop = $('fop').value;
  if (fmt && fop !== 'f') {
    user.push(`${fop}:${fmt}`);
    tests.push(c => c.legalities[fmt] === fop);
  }
  if ($('isCmd').checked) {
    user.push('is:commander');
    tests.push(c => c.commander);
  }
  const remote = [
    v('mana') && `m:${v('mana').replace(/\s/g, '')}`,
    any(checked('game').map(g => `game:${g}`)),
    any(v('set').split(/[\s,]+/).filter(Boolean).map(c => `s:${c}`)),
    any(checked('rar').map(r => `r:${r}`)),
    ...v('crit').split(/\s+/).filter(Boolean).map(w => w[0] === '-' ? `-is:${w.slice(1)}` : `is:${w}`),
    v('price') !== '' && `${$('cur').value}${$('curop').value}${v('price')}`,
    v('artist') && `a:${quote(v('artist'))}`,
    v('flavor') && `ft:${quote(v('flavor'))}`,
    $('lang').value && `lang:${$('lang').value}`,
    $('prefer').value && `prefer:${$('prefer').value}`,
  ].filter(Boolean);
  if (remote.length || $('prints').checked || $('extras').checked) local = false;
  user.push(...remote);
  const defaults = [];
  if (fmt && fop === 'f') { defaults.push(`f:${fmt}`); tests.push(c => ['legal', 'restricted'].includes(c.legalities[fmt])); }
  if ($('inId').checked && deck.commander) { defaults.push(`id<=${deck.identity || 'c'}`); tests.push(identity([...(deck.identity || 'c')])); }
  const u = user.filter(Boolean);
  return { q: u.concat(defaults).join(' '), local: local ? c => tests.every(t => t(c)) : null };
}

const sorters = {
  name: (a, b) => a.name.localeCompare(b.name),
  cmc: (a, b) => a.cmc - b.cmc,
  edhrec: (a, b) => (a.edhrec_rank ?? 1e9) - (b.edhrec_rank ?? 1e9),
};
const edhStat = c => edh[c.name] || edh[c.name.split(' // ')[0]];
const bySynergy = () => ['syn', 'inc'].includes($('order').value);

// Commander sorts put cards EDHREC lists for the commander first, highest first;
// the rest keep their previous order.
function sortCards(list, localSort) {
  const o = $('order').value;
  if (bySynergy()) {
    list.sort((a, b) => (edhStat(b)?.[o] ?? -Infinity) - (edhStat(a)?.[o] ?? -Infinity));
    if ($('dir').value === 'asc') list.reverse();
  } else if (localSort) {
    list.sort(sorters[o] || sorters.edhrec);
    if ($('dir').value === 'desc') list.reverse();
  }
  return list;
}

let gen = 0, redraw = () => {};  // redraw re-renders the latest results, e.g. after the deck changes
const MAX_PAGES = 60, MAX_OTHER = 175;

async function search() {
  if (!deck) return;  // decks still loading
  const my = ++gen;
  const { q, local } = buildQuery();
  $('full').textContent = q;
  let ownedList = [], otherList = [], total = 0;
  const draw = redraw = () => {
    const notInDeck = c => c.name !== deck.commander && !deck.cards.includes(c.name);
    const owned = sortCards(ownedList, local).filter(notInDeck);
    const other = sortCards(otherList, false).filter(notInDeck).slice(0, MAX_OTHER);
    $('owned').replaceChildren(...owned.map(cardEl));
    $('other').replaceChildren(...other.map(cardEl));
    $('nOwned').textContent = owned.length;
    $('nOther').textContent = other.length + (total - ownedList.length > MAX_OTHER ? ` of ${total - ownedList.length}` : '');
  };
  draw();
  if (!q) { $('status').textContent = ''; return; }
  const order = bySynergy() ? 'edhrec' : $('order').value;
  const params = new URLSearchParams({ q, order, dir: $('dir').value, unique: $('prints').checked ? 'prints' : 'cards', include_extras: $('extras').checked });
  let url = 'https://api.scryfall.com/cards/search?' + params;
  if (local) {
    ownedList = ownedCards.filter(local);
    if (bySynergy()) otherList = edhCards.filter(c => !isOwned(c.name) && local(c));
    draw();
  }
  const seen = new Set(otherList.map(c => c.name));
  const maxPages = local ? 1 : MAX_PAGES;
  let page = 0;
  while (url && page < maxPages) {
    $('status').textContent = `loading page ${page + 1}...`;
    const r = await (await fetch(url)).json();
    if (my !== gen) return;
    if (r.object === 'error') { $('status').textContent = r.details; return; }
    total = r.total_cards;
    for (const c of r.data) {
      if (isOwned(c.name)) { if (!local) ownedList.push(c); }
      else if (!seen.has(c.name)) { seen.add(c.name); otherList.push(c); }
    }
    draw();
    url = r.has_more ? r.next_page : null;
    page++;
    if (url && page < maxPages) { await sleep(500); if (my !== gen) return; }
  }
  $('status').textContent = `${total} matches` + (local ? ' (owned: local database)' : url ? ` (scanned first ${MAX_PAGES} pages for owned cards, refine query)` : ' (owned: scanned Scryfall pages)');
}

let timer;
const searchSoon = () => { clearTimeout(timer); timer = setTimeout(search, 400); };

function cardEl(c) {
  const d = document.createElement('div');
  d.className = 'card' + (isOwned(c.name) ? ' owned' : '');
  d.innerHTML = `<img src="${big(small(c))}" loading="lazy">`;
  d.querySelector('img').title = `${c.name} (click to add)`;
  d.onclick = () => addCard(c);
  const s = edhStat(c);
  if (s) {
    const b = document.createElement('span');
    b.className = 'edh';
    b.title = 'EDHREC: synergy with your commander, share of its decks running this card';
    b.textContent = `${s.syn >= 0 ? '+' : ''}${Math.round(s.syn * 100)}% syn · ${Math.round(s.inc * 100)}%`;
    d.appendChild(b);
  }
  if (commanders.has(c.name)) {
    const b = document.createElement('button');
    b.textContent = 'Set commander';
    b.onclick = e => { e.stopPropagation(); setCommander(c); };
    d.appendChild(b);
  }
  return d;
}

function slug(name) {
  return name.split(' // ')[0].normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9 -]/g, '').trim().replace(/[\s-]+/g, '-');
}

async function setCommander(c) {
  deck.commander = c.name;
  deck.identity = c.color_identity.join('').toLowerCase();
  deck.cards = deck.cards.filter(n => n !== c.name);
  remember(c);
  save(); renderDeck();
  await loadEdh();
}

async function loadEdh() {
  edh = {}; edhCards = [];
  if (!deck.commander) return searchSoon();
  $('status').textContent = 'loading EDHREC...';
  const r = await fetch('edhrec/' + slug(deck.commander));
  if (!r.ok) { $('status').textContent = 'EDHREC lookup failed'; return; }
  for (const list of (await r.json()).container.json_dict.cardlists)
    for (const c of list.cardviews) edh[c.name] = { syn: c.synergy || 0, inc: c.num_decks / c.potential_decks };
  edhCards = await (await fetch('cards.json', { method: 'POST', body: JSON.stringify(Object.keys(edh)) })).json();
  searchSoon();
}

$('form').oninput = $('querybar').oninput = searchSoon;
$('dgroup').onchange = $('dsort').onchange = () => { localStorage.setItem('deckView', $('dgroup').value + ' ' + $('dsort').value); renderDeck(); };
[$('dgroup').value, $('dsort').value] = (localStorage.getItem('deckView') || 'type cmc').split(' ');
$('export').onclick = () => {
  const lines = (deck.commander ? [`1 ${deck.commander}`] : []).concat(deck.cards.sort().map(n => `1 ${n}`));
  navigator.clipboard.writeText(lines.join('\n'));
};

fetch('https://api.scryfall.com/sets').then(r => r.json()).then(r => {
  for (const x of r.data) { const o = document.createElement('option'); o.value = x.code; o.label = x.name; $('sets').appendChild(o); }
});
loadCollection().then(loadDecks);
</script>
